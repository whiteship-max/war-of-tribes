<!-- Заставка экрана загрузки. Источник; в игру она попадает разметкой прямо
     в index.html — экран загрузки живёт там целиком и без единого запроса.
     Словарь тот же, что у мира: палитра render/palette.ts, плоские грани,
     ни одной текстуры. Первый кадр игры, а не обложка чужой.

     Кольцо стены — две дуги одного эллипса: задняя выгибается от зрителя и
     уходит за крыши, передняя выгибается к зрителю, и в её нижней точке ворота.
     Если обе гнуть в одну сторону, посёлок читается мостом. -->
<svg viewBox="0 0 256 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="bs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7cfe9"/>
      <stop offset=".62" stop-color="#c4d9e8"/>
      <stop offset="1" stop-color="#dc8c60"/>
    </linearGradient>
    <radialGradient id="bg1" cx="50%" cy="58%" r="46%">
      <stop offset="0" stop-color="#ff9a3a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bc"><rect width="256" height="160" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#bc)">
    <rect width="256" height="160" fill="url(#bs)"/>
    <circle cx="204" cy="70" r="15" fill="#ffe4bf"/>
    <!-- дальние хребты уходят в дымку -->
    <path d="M0 76l38-16 30 12 34-18 40 20 32-12 44 18 38-10v28H0z" fill="#c4d9e8"/>
    <path d="M0 88l30-12 34 14 36-16 34 16 40-14 52 18v18H0z" fill="#8f8b84"/>
    <path d="M0 100l44-14 40 16 44-14 46 16 42-10v16H0z" fill="#66884a"/>
    <!-- лес по гребню -->
    <g fill="#4a8a48">
      <path d="M6 102l7-14 7 14zM24 102l6-12 6 12zM40 101l8-15 8 15zM60 102l6-12 6 12z"/>
      <path d="M192 102l7-13 7 13zM210 103l6-12 6 12zM226 101l8-15 8 15zM244 102l6-12 6 12z"/>
    </g>
    <!-- поле под посёлком -->
    <path d="M0 106h256v54H0z" fill="#7fa552"/>
    <path d="M0 130c40-6 72-8 128-8s88 2 128 8v30H0z" fill="#97b85c"/>
    <!-- тёплый свет от костра внутри стены -->
    <ellipse cx="128" cy="100" rx="66" ry="26" fill="url(#bg1)" class="gl"/>
    <!-- задняя дуга кольца: выгнута от зрителя, ниже её закроют крыши -->
    <path d="M52 104Q128 76 204 104l0 6Q128 84 52 110z" fill="#5b4029"/>
    <!-- дворы за стеной: черепица и штукатурка -->
    <g>
      <path d="M74 96h17v12H74z" fill="#c9b48c"/><path d="M71 96l11.5-11L94 96z" fill="#b85a3e"/>
      <path d="M97 88h22v20H97z" fill="#e4dac6"/><path d="M93 88l15-13 15 13z" fill="#aa5136"/>
      <path d="M126 92h20v16h-20z" fill="#c9b48c"/><path d="M122 92l14-12 14 12z" fill="#b85a3e"/>
      <path d="M152 96h16v12h-16z" fill="#e4dac6"/><path d="M149 96l11-10 11 10z" fill="#aa5136"/>
    </g>
    <!-- знамя над посёлком -->
    <path d="M106 52h4v34h-4z" fill="#60432a"/>
    <path d="M110 54h30l-8 8 8 8h-30z" fill="#e8a43c"/>
    <!-- дым очага -->
    <g fill="#d8d2c8" opacity=".7">
      <circle cx="139" cy="74" r="3"/><circle cx="142" cy="65" r="2.4"/><circle cx="138" cy="57" r="1.8"/>
    </g>
    <!-- передняя дуга кольца: выгнута к зрителю -->
    <path d="M52 104Q128 132 204 104l0 7Q128 139 52 111z" fill="#60432a"/>
    <!-- колья по передней дуге -->
    <g fill="#6f4f34">
      <path d="M56 108l4 1 1 11-4-1zM70 114l4 1.5 1 11-4-1.5zM86 119l4 1.5 1 11-4-1.5z"/>
      <path d="M166 120.5l4-1.5 1 11-4 1.5zM182 115.5l4-1.5 1 11-4 1.5zM196 109l4-1 1 11-4 1z"/>
    </g>
    <!-- ворота в нижней точке дуги -->
    <path d="M108 118h40v14h-40z" fill="#5b4029"/>
    <path d="M112 121h32v11h-32z" fill="#8c6238"/>
    <path d="M126 121h4v11h-4z" fill="#5b4029"/>
    <path d="M104 114h48v6h-48z" fill="#6f4f34"/>
    <!-- дорога от ворот к зрителю и вытоптанная земля перед ней -->
    <path d="M112 132h32l24 28h-80z" fill="#9c9891"/>
    <ellipse cx="128" cy="133" rx="34" ry="5" fill="#7b6247" opacity=".5"/>
    <!-- ближний план: пни и кусты, как на расчистке вокруг деревни -->
    <g>
      <path d="M18 142h12v9H18z" fill="#6b4a30"/><ellipse cx="24" cy="142" rx="6" ry="2.5" fill="#c9a878"/>
      <path d="M226 148h13v10h-13z" fill="#6b4a30"/><ellipse cx="232.5" cy="148" rx="6.5" ry="2.8" fill="#c9a878"/>
      <path d="M46 158c0-9 7-15 14-15s14 6 14 15z" fill="#568f4c"/>
      <path d="M186 160c0-11 8-18 16-18s16 7 16 18z" fill="#4a8a48"/>
    </g>
  </g>
</svg>
