<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>После: карта мира</title>
<link rel="stylesheet" href="../assets/phone.css">
<link rel="stylesheet" href="../assets/after.css">
<style>
  /* Подпись своего города рисует холст карты (frame.ts, drawLabel) — тем же видом и в той же точке, что в «до». */
  .mock-canvas-label {
    position: absolute;
    left: 0;
    top: 0;
    width: 390px;
    height: 741px;
    pointer-events: none;
  }
</style>
<!--
  Карта «после» (ui_audit.md, 6.2). Состояние — то же, что у before/map.html: своя деревня под камерой, набег из Логова
  разбойников через 7:10 (сбор успевает ещё 3:25), «Походы 2», чужих замков нет (игра открыта не из Telegram).
  Верх в «до» на карте не рисуется: числа верха взяты из пары посёлка (before/village.html), золото условное.
  Набег показан новой тревогой — пилюлей с текстом (первые 4 с).
  Люди в столбце справа: в «до» их на экране нет; места агентов — дома, лазутчика нет (условно). Счётчик «Вести 1» —
  условно: весть о набеге.
-->
</head>
<body class="phone"><script src="../assets/sprite.js"></script><script src="../assets/stubs.js"></script>
<div class="sys"><span>9:41</span><span class="sys-icons"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div>
<div class="tgh"><span class="tgh-left">Закрыть</span><span class="tgh-title"><b>TRIBE</b><small>мини-приложение</small></span><span class="tgh-right"><span>···</span></span></div>
<div class="webview"><div class="scene map"></div>
  <svg class="mock-canvas-label" viewBox="0 0 390 741" aria-hidden="true">
    <text x="195.6" y="508.3" text-anchor="middle" dominant-baseline="text-before-edge"
          font-family="system-ui, sans-serif" font-size="11"
          fill="#e8a43c" stroke="rgba(10, 8, 6, 0.85)" stroke-width="3" stroke-linejoin="miter"
          paint-order="stroke">Безымянный город</text>
  </svg>

  <!-- Верх — тот же, что в посёлке -->
  <div class="hud">
    <div class="hud-top">
      <div class="coat">
        <svg class="shield" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M6 5 H34 V19 C34 28 27 33 20 36 C13 33 6 28 6 19 Z" fill="#e8a43c" stroke="#b07724" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M13 11 H16 V13.5 H18.5 V11 H21.5 V13.5 H24 V11 H27 V17 H25.5 V28 H14.5 V17 H13 Z" fill="#241a11"/>
          <path d="M18 28 V23.5 C18 22 22 22 22 23.5 V28 Z" fill="#e8a43c"/>
        </svg>
      </div>
      <div class="stat"><svg class="ic"><use href="#i-res-gold"/></svg><b>240</b></div>
      <div class="stat"><svg class="ic"><use href="#i-hud-pop"/></svg><b>55</b><small>/55</small></div>
      <div class="stat"><svg class="ic"><use href="#i-mood-mid"/></svg><b>58</b></div>
      <div class="stat"><svg class="ic"><use href="#i-hud-army"/></svg><b>0</b></div>
      <div class="grow"></div>
      <div class="stat season">
        <div class="season-line"><svg class="ic i20"><use href="#i-season-sun"/></svg></div>
        <div class="prog"><i style="width:77%"></i></div>
      </div>
    </div>
    <div class="res-row">
      <div class="res"><span class="ri"><svg class="ic"><use href="#i-res-wood"/></svg><i class="tr up"></i></span><b>1,2к</b></div>
      <div class="res"><span class="ri"><svg class="ic"><use href="#i-res-stone"/></svg><i class="tr up"></i></span><b>860</b></div>
      <div class="res full"><span class="ri"><svg class="ic"><use href="#i-res-food"/></svg></span><b>4,8к</b></div>
      <div class="res"><span class="ri"><svg class="ic"><use href="#i-res-hides"/></svg><i class="tr up"></i></span><b>140</b></div>
      <div class="res"><span class="ri"><svg class="ic"><use href="#i-res-bones"/></svg></span><b>95</b></div>
      <div class="res"><span class="ri"><svg class="ic"><use href="#i-res-copper"/></svg></span><b>60</b></div>
      <div class="res"><span class="ri"><svg class="ic"><use href="#i-res-iron"/></svg><i class="tr down"></i></span><b>38</b></div>
    </div>
  </div>

  <!-- Новая тревога: пилюля первые 4 с, потом сворачивается в значок; тап — камера на колонну и весть -->
  <div class="alerts">
    <div class="alert pill"><div class="ring"><svg class="ic i24"><use href="#i-alert-raid"/></svg></div><b>Набег из Логова разбойников</b><span class="t">7:10</span></div>
  </div>

  <!-- Столбец своих людей и походов: тап — человек в руку и камера на него; второй тап — карточка -->
  <div class="outl">
    <div class="o"><svg class="ic"><use href="#i-fig-scout"/></svg>дома</div>
    <div class="o"><svg class="ic"><use href="#i-fig-diplomat"/></svg>дома</div>
    <div class="o"><svg class="ic"><use href="#i-fig-general"/></svg>дома</div>
    <div class="o off"><svg class="ic"><use href="#i-fig-spy"/></svg>нет<svg class="lk not-in-sheet"><use href="#i-ui-lock"/></svg></div>
    <div class="gap"></div>
    <div class="o foe"><svg class="ic"><use href="#i-alert-raid"/></svg><span>7:10</span></div>
  </div>

  <!-- Кнопки над низом: камера к своему городу, легенда, масштаб -->
  <div class="mapbtn" style="left:8px; bottom:calc(var(--nav-h) + var(--safe-bottom) + 8px)"><svg class="ic i20"><use href="#i-rel-self"/></svg>К городу</div>
  <div class="mapbtn round" style="right:8px; bottom:calc(var(--nav-h) + var(--safe-bottom) + 60px)"><svg class="ic i20 not-in-sheet"><use href="#i-ui-info"/></svg><i class="dot-new"></i></div>
  <div class="mapbtn round" style="right:8px; bottom:calc(var(--nav-h) + var(--safe-bottom) + 8px)"><svg class="ic i20"><use href="#i-ui-spyglass"/></svg></div>

  <!-- Низ: пять мест, в центре — «Город» -->
  <nav class="nav">
    <button><span class="ib"><svg class="ic i28"><use href="#i-ui-hammer"/></svg></span>Стройка</button>
    <button><span class="ib"><svg class="ic i28"><use href="#i-nav-people"/></svg></span>Племя</button>
    <button class="main"><span class="ib"><svg class="ic i28"><use href="#i-ui-home"/></svg></span>Город</button>
    <button><span class="ib"><svg class="ic i28"><use href="#i-hud-army"/></svg></span>Дружина</button>
    <button><span class="ib"><svg class="ic i28 not-in-sheet"><use href="#i-ui-mail"/></svg><span class="badge urgent">1</span></span>Вести</button>
  </nav>
</div>
<div class="home-ind"></div></body></html>
