            <span class="txt">

            <span class="ic"><svg viewBox="0 0 32 32" width="1em" height="1em" style="vertical-align:-0.15em" role="img"><use href="#i-evt-wanderers"/></svg></span>
            <span class="txt">

</div>
<script>
// То же, что делают эффекты RealmMenu при открытии: верх меню — по низу полоски ресурсов
// (отсчёт от .app — в игре это начало окна), активная вкладка видна в ленте (inline: 'nearest').
(function () {
  var app = document.querySelector('.app');
  var bar = document.querySelector('.res-bar');
  var realm = document.querySelector('.realm');
  realm.style.top = Math.ceil(bar.getBoundingClientRect().bottom - app.getBoundingClientRect().top) + 'px';
  var tabs = document.querySelector('.realm-tabs');
  var a = tabs.querySelector('.active');
  var tr = tabs.getBoundingClientRect();
  var ar = a.getBoundingClientRect();
  if (ar.right > tr.right) tabs.scrollLeft += ar.right - tr.right;
  else if (ar.left < tr.left) tabs.scrollLeft -= tr.left - ar.left;
})();
</script>
<div class="home-ind"></div></body></html>
