# Игра за прокси Coolify на том же сервере (docs/SERVER.md, «Вариант с Coolify»). Это дополнение к
# docker-compose.yml, а не замена: образы, тома, переменные и команды — те же. Разница одна: порты 80 и 443
# держит прокси Coolify (Traefik) и сам получает сертификат HTTPS, а Caddy игры слушает простой HTTP в сети
# `coolify` и получает от него запросы по меткам ниже. Включается строкой в .env на сервере:
#
#   COMPOSE_FILE=docker-compose.yml:deploy/behind-coolify.yml
#
# дальше всё как в основном варианте — `docker compose up -d --build`, `sh deploy/update.sh`, журналы и копии.
# TRIBE_DOMAIN в .env — домен игры: из него правило прокси, а Caddy за прокси слушает ":80".
services:
  web:
    ports: !reset []
    environment:
      TRIBE_DOMAIN: ":80"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.tribe-http.rule=Host(`${TRIBE_DOMAIN}`)
      - traefik.http.routers.tribe-http.entrypoints=http
      - traefik.http.routers.tribe-http.middlewares=tribe-https
      - traefik.http.middlewares.tribe-https.redirectscheme.scheme=https
      - traefik.http.routers.tribe.rule=Host(`${TRIBE_DOMAIN}`)
      - traefik.http.routers.tribe.entrypoints=https
      - traefik.http.routers.tribe.tls=true
      - traefik.http.routers.tribe.tls.certresolver=letsencrypt
      - traefik.http.services.tribe.loadbalancer.server.port=80

networks:
  # Сеть прокси Coolify: её заводит установка Coolify.
  coolify:
    external: true
