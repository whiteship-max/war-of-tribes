# Игра под Coolify (docs/SERVER.md, «Вариант с Coolify»). Те же два образа, что в docker-compose.yml,
# но без портов наружу: 80 и 443 держит прокси самого Coolify, он же получает сертификат HTTPS для
# домена, который владелец назначит сервису `web` в панели. Caddy за ним слушает простой HTTP (:80).
# Переменные вписываются в панели Coolify (Environment Variables), не в этот файл.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TRIBE_STORE: ${TRIBE_STORE:-sqlite}
      TRIBE_DATA: /data
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      TRIBE_DELIVER: ${TRIBE_DELIVER:-off}
      TRIBE_WAR_PACE: ${TRIBE_WAR_PACE:-1}
      TRIBE_APP_URL: ${TRIBE_APP_URL:-}
      ADMIN_IDS: ${ADMIN_IDS:-}
      TRIBE_SPAWN: ${TRIBE_SPAWN:-}
      TON_NETWORK: ${TON_NETWORK:-}
      TON_WALLET: ${TON_WALLET:-}
      TON_USDT_MASTER: ${TON_USDT_MASTER:-}
      TON_USDT_DECIMALS: ${TON_USDT_DECIMALS:-}
      TON_API_KEY: ${TON_API_KEY:-}
      TON_API_URL: ${TON_API_URL:-}
      NETLIFY_SITE_ID: ${NETLIFY_SITE_ID:-}
      NETLIFY_AUTH_TOKEN: ${NETLIFY_AUTH_TOKEN:-}
    volumes:
      - tribe-data:/data

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "80"
    environment:
      TRIBE_DOMAIN: ":80"

volumes:
  tribe-data:
