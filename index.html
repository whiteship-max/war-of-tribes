<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1410" />
    <title>TRIBE</title>
    <!-- Герб игры (assets-src/brand/crest.svg, `npm run splash:build`): вкладка, экран «Домой» и ярлык Android. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!--
      Экран загрузки живёт здесь целиком: разметка, стили, картинка и код.
      Ни одного внешнего запроса, ни одного шрифта, ни байта из бандла.

      Причина одна и она решающая: экран, собранный тем же JavaScript, что и
      игра, появится только после загрузки этого JavaScript — то есть ровно
      после ожидания, которое он должен был закрыть. Первый кадр браузера уже
      обязан быть нашим.

      Из этого же правила выведена картинка, и вывод у неё обратный: она лежит
      отдельным файлом, а не строкой внутри документа. Вложенная строкой, она
      отодвинула бы первый кадр экрана на полсекунды, появляясь при этом в тот же
      момент (замер — docs/loading.md). Экран поэтому показывается на теме клиента,
      а арт проявляется поверх, когда доедет: ждать его экран не имеет права —
      он и заведён затем, чтобы закрывать ожидание, а не добавлять своё.

      Логика вынута в один объект TribeBoot и проверяется тестом, который
      читает ЭТОТ файл и выполняет ЭТОТ код (src/boot/boot.test.ts). Второй
      копии правил нет нигде.
    -->
    <style>
      /* Никакой белой вспышки: цвет стоит на html до всякой разметки, а через
         несколько строк его перебьёт цвет темы клиента. */
      html {
        background: var(--boot-bg, #1a1410);
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
        padding: 24px 24px 15vh;
        background: var(--boot-bg, #1a1410);
        /* Тёплый отсвет заката, если не доехал даже предпросмотр (см. #boot-blur). */
        background-image: radial-gradient(60% 34% at 50% 74%, rgba(255, 154, 58, 0.22), rgba(255, 154, 58, 0) 70%);
        overflow: hidden;
        /* Не из темы: строки лежат на тёмном арте, и светлый тон здесь —
           читаемость, а не оформление. У светлой темы клиента текст тёмный,
           и на пламени он утонул бы. Фон под артом и кнопку тема красит. */
        color: #f3e9d8;
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
        /* Показываемся не сразу: короткую загрузку игрок не должен увидеть вовсе.
           Класс `on` ставит код, когда порог пройден. */
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s linear;
      }
      #boot.on {
        opacity: 1;
        pointer-events: auto;
      }
      #boot.off {
        opacity: 0;
      }
      /* Арт лежит фоном во весь экран: город игры на закате (кадр движка — assets-src/splash/README.md).
         Пока он едет, виден его же предпросмотр — 12 точек шириной, строкой прямо здесь (#boot-blur):
         первый кадр экрана обязан выглядеть кадром игры, а не пустотой с подписью. */
      #boot-blur {
        position: absolute;
        inset: 0;
        background-size: cover;
        /* Те же числа, что у object-position ниже: размытый кадр лежит ровно под чётким. */
        background-position: 50% 31%;
        background-image: url(data:image/webp;base64,UklGRmIAAABXRUJQVlA4IFYAAABwAwCdASoMABQAPu1iqU2ppaOiMAgBMB2JQBOgA2AYe+jNORAA/tofEcTk5rYxFtXqGUp7vEVQgIOF0f9b0rH7KyIkBDerky/vUscor5a6pI9R4nAAAA==);
        /* Растянутые 12 точек — квадраты; размытие их прячет, а увеличение — светлую кайму размытия у края. */
        filter: blur(14px);
        transform: scale(1.08);
      }
      #boot-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /*
          Куда смотреть, когда кадр не влезает. Кадр вертикальный (0.6): ворота города внизу, площадь
          и собор посередине, донжон и лес вверху.

          Телефон (0.46) режет по бокам и оставляет 77 % ширины — середину: 50 % по горизонтали, город
          в кадре целиком по высоте.

          Широкое окно (16:10) показывает лишь 37 % высоты, и это уже выбор, что потерять. 31 % по
          вертикали ставит окно на 0.20…0.57 кадра: донжон, собор и площадь — сердце города — в кадре,
          ворота и пригород уходят. Ниже — уходит донжон, выше — собор прижимается к краю.
        */
        object-position: 50% 31%;
        opacity: 0;
        transition: opacity 0.4s ease-out;
      }
      #boot-art.on {
        opacity: 1;
      }
      /* Затемнение под строками: светлый текст на пёстрых крышах иначе тонет. */
      #boot-scrim {
        position: absolute;
        inset: auto 0 0;
        height: 52%;
        background: linear-gradient(180deg, rgba(26, 20, 16, 0) 0%, rgba(26, 20, 16, 0.82) 58%, rgba(26, 20, 16, 0.96) 100%);
      }
      /* Название — сверху, над лесом: там кадр тёмный, а затемнение сверху делает его ровным. На том же
         месте и теми же буквами оно стоит на стартовом экране (.start-name): смена экранов его не двигает. */
      #boot-top {
        position: absolute;
        inset: 0 0 auto;
        height: 34%;
        background: linear-gradient(180deg, rgba(26, 20, 16, 0.62) 0%, rgba(26, 20, 16, 0) 100%);
      }
      #boot-name {
        position: absolute;
        top: 14%;
        left: 0;
        right: 0;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.22em;
        /* Отступ съедает межбуквенный интервал последней буквы — иначе слово стоит криво. */
        text-indent: 0.22em;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
      }
      #boot-say {
        position: relative;
        max-width: 22em;
        opacity: 0.85;
        font-style: italic;
      }
      /* Полоса — как полосы игры (.progress в ui/styles.css): 6 точек, круглые концы, тёмный жёлоб. */
      #boot-bar {
        position: relative;
        width: min(240px, 64vw);
        height: 6px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.4);
        box-shadow: inset 0 0 0 1px rgba(255, 220, 170, 0.12);
        overflow: hidden;
      }
      #boot-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--boot-accent, #e8a43c);
        transition: width 0.28s ease-out;
      }
      #boot-stage {
        position: relative;
        font-size: 13px;
        opacity: 0.7;
        min-height: 1.4em;
      }
      #boot-err {
        position: relative;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: 20em;
      }
      #boot.bad #boot-err {
        display: flex;
      }
      #boot.bad #boot-bar,
      #boot.bad #boot-stage,
      #boot.bad #boot-say {
        display: none;
      }
      #boot-retry {
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 14px;
        font: inherit;
        font-weight: 600;
        color: var(--boot-accent-text, #241a0e);
        background: var(--boot-accent, #e8a43c);
      }
      #boot-why {
        font-size: 12px;
        opacity: 0.6;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot" role="status" aria-live="polite">
      <!-- Заставка: город игры на закате — кадр самого движка, а не рисунок (assets-src/splash/README.md).
           Собирается `npm run splash:build` из assets-src/splash/city-full.jpg и лежит отдельным файлом, а
           не строкой внутри документа. Замер в docs/loading.md: вложенная целиком строкой, картинка растит
           index.html на десятки килобайт и отодвигает первый кадр экрана загрузки на 3G на полсекунды,
           появляясь при этом в тот же момент.

           Строкой лежит только предпросмотр — тот же кадр в 12 точек, полкилобайта (#boot-blur): с ним
           экран с первого кадра — размытый город, а чёткий проявляется поверх, когда доедет.

           Экрана картинка не задерживает ни на миллисекунду: она лежит прозрачной и проявляется по своему
           `onload`, а пороги показа (240 мс) и минимальной выдержки (520 мс) считает машинка ниже и про арт
           не знает вовсе. Не приедет совсем — останется размытый город: ни белой вспышки, ни пустоты.

           `onerror` убирает саму картинку, а не прячет её стилем: `alt=""` значка битого файла в Chrome не
           снимает, и не приехавший арт оставлял бы в углу рваный листок поверх ровного экрана. -->
      <div id="boot-blur"></div>
      <img
        id="boot-art"
        src="/assets/splash/boot.webp"
        alt=""
        aria-hidden="true"
        decoding="async"
        fetchpriority="high"
        onload="this.className='on'"
        onerror="this.remove()"
      />
      <div id="boot-scrim"></div>
      <div id="boot-top"></div>
      <div id="boot-name">TRIBE</div>

      <div id="boot-say"></div>
      <div id="boot-bar"><div id="boot-fill"></div></div>
      <div id="boot-stage"></div>

      <div id="boot-err">
        <div id="boot-msg">Игра не загрузилась.</div>
        <button id="boot-retry" type="button">Повторить</button>
        <div id="boot-why"></div>
      </div>
    </div>

    <script>
      /* eslint-disable */
      var TribeBoot = (function () {
        'use strict';

        /**
         * Порог показа. Меньше него экран не появляется вовсе.
         *
         * 240 мс — не круглое число «на глаз». Отклик короче четверти секунды
         * человек читает как мгновенный: за этой границей нет ожидания, которое
         * надо объяснять. Экран, успевший появиться и исчезнуть внутри неё,
         * сообщает не «идёт загрузка», а «что-то мигнуло» — то есть выглядит
         * сбоем. Всё, что укладывается в 240 мс (а это весь запуск из кэша),
         * игрок обязан увидеть как прямой переход к игре.
         */
        var SHOW_AFTER_MS = 240;

        /**
         * Появившись, экран держится минимум столько. Иначе порог лечил бы
         * только один край: загрузка, отставшая от порога на десяток
         * миллисекунд, дала бы ту же вспышку, ради которой порог и заведён.
         */
        var MIN_VISIBLE_MS = 520;

        /** Не дождались — показываем поломку, а не вечное колесо. */
        var FAIL_AFTER_MS = 20000;

        /** Ключ счётчика заходов. Отдельный от сохранения: он про экран, не про партию. */
        var COUNT_KEY = 'tribe.boot.n';

        /**
         * Стадии. Настоящие: каждая ставится тем кодом, который эту работу и
         * делает, поддельной полоски «до 90% и висим» здесь нет.
         * `at` — доля полосы, на которой стадия начинается.
         */
        var STAGES = {
          code: { at: 0.08, text: 'Поднимаем знамя' },
          save: { at: 0.34, text: 'Разбираем летопись' },
          offline: { at: 0.52, text: 'Считаем, что было без тебя' },
          scene: { at: 0.78, text: 'Ставим город' },
          done: { at: 1, text: '' }
        };

        /** Присказки. По одной за заход, следующий заход — следующая. */
        var SAYINGS = [
          'Кто рано встал, тому и хлеб тёплый.',
          'Зима спросит, где летом был.',
          'Не хвались походом, хвались возвращением.',
          'Один в поле воин, да недолго.',
          'Сытый город стены не бросит.',
          'Кузнец куёт, покуда горн дышит.',
          'У соседа за пазухой не считай, свой амбар меряй.',
          'Тихая река берега точит.',
          'Слово правителя дешевле хлеба, да дороже золота.',
          'Худой мир лучше доброй драки, да драки не миновать.'
        ];

        /**
         * Цвет фона до всякого JavaScript игры. Telegram отдаёт палитру клиента
         * в themeParams, и белый экран на тёмной теме выглядит поломкой ещё до
         * запуска. Нет клиента или нет цвета — остаётся наш тёмный.
         */
        function themeColors(win) {
          var p = null;
          try {
            p = win && win.Telegram && win.Telegram.WebApp && win.Telegram.WebApp.themeParams;
          } catch (e) {
            p = null;
          }
          var hex = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
          var pick = function (v) {
            return typeof v === 'string' && hex.test(v) ? v : null;
          };
          return {
            bg: p ? pick(p.bg_color) : null,
            text: p ? pick(p.text_color) : null,
            accent: p ? pick(p.button_color) : null,
            accentText: p ? pick(p.button_text_color) : null
          };
        }

        /**
         * Номер захода. Детерминированный: счётчик в localStorage, а не
         * Math.random. Нет хранилища — берём номер дня по UTC: он одинаков для
         * всех запусков этого дня, но от заглушки «всегда первая» избавляет.
         */
        function visitNo(store, nowMs) {
          try {
            var n = parseInt(store.getItem(COUNT_KEY) || '0', 10);
            if (!isFinite(n) || n < 0) n = 0;
            store.setItem(COUNT_KEY, String(n + 1));
            return n;
          } catch (e) {
            return Math.floor(nowMs / 86400000);
          }
        }

        /** Присказка захода. Чистая функция от номера. */
        function sayingOf(no) {
          var n = SAYINGS.length;
          return SAYINGS[((no % n) + n) % n];
        }

        /**
         * Машинка экрана. DOM приходит снаружи, поэтому её можно прогнать
         * тестом без браузера — и прогоняется ровно этот код, не его копия.
         */
        function create(env) {
          var doc = env.doc;
          var now = env.now;
          var t0 = now();
          var el = {};
          var shownAt = -1;
          var finished = false;
          var failed = false;
          var showTimer = null;
          var frozen = false;
          var failTimer = null;
          var pending = null;

          var byId = function (id) {
            if (!(id in el)) el[id] = doc.getElementById(id);
            return el[id];
          };

          var css = function (name, value) {
            if (value) doc.documentElement.style.setProperty(name, value);
          };

          function paintTheme() {
            var c = themeColors(env.win);
            css('--boot-bg', c.bg);
            css('--boot-text', c.text);
            css('--boot-accent', c.accent);
            css('--boot-accent-text', c.accentText);
            return c;
          }

          function show() {
            showTimer = null;
            if (finished || shownAt >= 0) return;
            shownAt = now();
            var box = byId('boot');
            if (box) box.className = failed ? 'on bad' : 'on';
          }

          function hide() {
            var box = byId('boot');
            if (box) box.className = 'off';
            if (env.onHidden) env.onHidden();
          }

          /** Стадия: подпись и настоящая доля полосы. */
          function stage(name) {
            var st = STAGES[name];
            if (!st || failed || frozen) return;
            // `?boot=<стадия>` замирает на ней — иначе снять кадром стадию, которая
            // живёт полсекунды, нечем.
            if (debug === name) frozen = true;
            var label = byId('boot-stage');
            if (label) label.textContent = st.text;
            var fill = byId('boot-fill');
            if (fill) fill.style.width = Math.round(st.at * 100) + '%';
            if (env.mark) env.mark('tribe-' + name);
          }

          /** Готово. Если экран так и не показался — он и не покажется. */
          function done() {
            if (finished || failed || debug) return;
            finished = true;
            if (showTimer !== null) env.clear(showTimer);
            if (failTimer !== null) env.clear(failTimer);
            stage('done');
            if (shownAt < 0) {
              hide();
              return;
            }
            var left = MIN_VISIBLE_MS - (now() - shownAt);
            if (left > 0) env.delay(hide, left);
            else hide();
          }

          /** Поломка: человек видит причину и кнопку, а не бесконечное колесо. */
          function fail(why) {
            if (finished || failed) return;
            failed = true;
            if (showTimer !== null) env.clear(showTimer);
            if (failTimer !== null) env.clear(failTimer);
            shownAt = shownAt < 0 ? now() : shownAt;
            var box = byId('boot');
            if (box) box.className = 'on bad';
            var why$ = byId('boot-why');
            if (why$) why$.textContent = why ? String(why).slice(0, 160) : '';
            var btn = byId('boot-retry');
            if (btn && !btn.__wired) {
              btn.__wired = true;
              btn.addEventListener('click', function () {
                env.reload();
              });
            }
          }

          /**
           * Отладка адресом — тем же приёмом, что `?worldview=` (src/debug.ts).
           * Экран живёт доли секунды и исчезает: снять его кадром иначе нечем, а
           * приёмка «на глаз, по памяти» — это не приёмка. `?boot=hold` держит
           * экран открытым, `?boot=fail` показывает поломку.
           *
           * Флаг ничего не ускоряет и не замедляет: игра под ним грузится ровно
           * так же, просто экран не уходит.
           */
          var debug = env.debug || '';
          if (debug && debug !== 'hold' && debug !== 'fail' && !STAGES[debug]) debug = 'hold';
          if (debug === 'fail') env.delay(function () {
            fail('Проверь связь.');
          }, 0);

          paintTheme();
          if (env.onTheme) env.onTheme(paintTheme);
          var no = visitNo(env.store, Date.now ? Date.now() : 0);
          pending = sayingOf(no);
          showTimer = env.delay(show, debug ? 0 : SHOW_AFTER_MS);
          failTimer = debug
            ? null
            : env.delay(function () {
                fail('Грузится слишком долго. Проверь связь.');
              }, FAIL_AFTER_MS);

          return {
            stage: stage,
            done: done,
            fail: fail,
            saying: pending,
            /** Разметка появляется позже кода в <head> — подписи ставим, когда она есть. */
            attach: function () {
              var say = byId('boot-say');
              if (say) say.textContent = pending;
              stage('code');
            },
            visible: function () {
              return shownAt >= 0;
            },
            elapsed: function () {
              return now() - t0;
            },
            failed: function () {
              return failed;
            }
          };
        }

        return {
          SHOW_AFTER_MS: SHOW_AFTER_MS,
          MIN_VISIBLE_MS: MIN_VISIBLE_MS,
          FAIL_AFTER_MS: FAIL_AFTER_MS,
          COUNT_KEY: COUNT_KEY,
          STAGES: STAGES,
          SAYINGS: SAYINGS,
          themeColors: themeColors,
          visitNo: visitNo,
          sayingOf: sayingOf,
          create: create
        };
      })();

      /* В браузере машинка запускается сразу: часы стадий должны идти с первого
         кадра, а не с момента, когда доедет бандл. В тесте (document нет) —
         не запускается, и тест зовёт create() со своим окружением. */
      if (typeof document !== 'undefined') {
        window.__boot = TribeBoot.create({
          doc: document,
          win: window,
          now: function () {
            return performance.now();
          },
          delay: function (fn, ms) {
            return setTimeout(fn, ms);
          },
          clear: function (id) {
            clearTimeout(id);
          },
          reload: function () {
            location.reload();
          },
          store: window.localStorage,
          // Отметки стадий. Так запуск меряется на живом телефоне без отладчика:
          // performance.getEntriesByType('mark') — и видно, где именно ушло время.
          mark: function (name) {
            try {
              performance.mark(name);
            } catch (e) {
              /* нет performance — не беда */
            }
          },
          debug: (/[?&]boot=([a-z]+)/.exec(location.search) || [])[1] || '',
          onHidden: function () {
            var box = document.getElementById('boot');
            if (box && box.parentNode) box.parentNode.removeChild(box);
            // Отметка запуска. Строчка кода, зато запуск меряется на живом
            // телефоне без отладчика: performance.getEntriesByName('tribe-ready').
            try {
              performance.mark('tribe-ready');
            } catch (e) {
              /* нет performance — не беда */
            }
          },
          onTheme: function (repaint) {
            try {
              window.Telegram.WebApp.onEvent('themeChanged', repaint);
            } catch (e) {
              /* нет клиента — нечего слушать */
            }
          }
        });
        document.addEventListener('DOMContentLoaded', function () {
          window.__boot.attach();
        });
        // Не загрузился модуль игры или упал на старте — это поломка, а не ожидание.
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
              window.__boot.fail('Проверь связь.');
              return;
            }
            if (e && e.message) window.__boot.fail(e.message);
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          window.__boot.fail((r && r.message) || 'Ошибка при запуске.');
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
