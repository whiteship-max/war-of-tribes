[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Серверная часть: хранение прогресса и серверные часы. Пути функции объявляют
# сами (`export const config = { path }`) — платформа разбирает их до
# переписываний, поэтому общее правило «любой путь отдаёт index.html» ниже их не
# перехватывает, и порядок правил в двух файлах перестаёт иметь значение.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Одностраничное приложение: любой путь отдаёт index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
